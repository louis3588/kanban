name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend - Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./kanbanBackend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        if: github.event_name == 'pull_request'
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: dotnet test --no-build --configuration Release
        
      - name: Test with coverage
        if: github.event_name == 'push'
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload backend coverage
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: kanbanBackend/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend - Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./kanbanFrontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./kanbanFrontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        if: github.event_name == 'pull_request'
        env:
          JWTSECRET: ${{ secrets.JWT_SECRET }}
        run: npm test -- --runInBand

      # Generate coverage only when main is updated
      - name: Test with coverage
        if: github.event_name == 'push'
        env:
          JWTSECRET: ${{ secrets.JWT_SECRET }}
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: kanbanFrontend/coverage/cobertura-coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Build Expo web application
        run: npx expo export --platform web

  docker:
    name: Docker - Build and Push Backend
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Remove existing local image
        run: |
          docker image rm ${{ secrets.DOCKERHUB_USERNAME }}/kanbanbackend:latest || true

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/kanbanbackend:latest \
            ./kanbanBackend

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/kanbanbackend:latest
