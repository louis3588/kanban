name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend - Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./kanbanBackend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: dotnet test --no-build --configuration Release


  frontend:
    name: Frontend - Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./kanbanFrontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./kanbanFrontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        env:
          JWTSECRET: ${{ secrets.JWT_SECRET }}
        run: npm test -- --runInBand

      - name: Build Expo web application
        run: npx expo export --platform web


  docker:
    name: Docker - Build and Push Backend
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Remove existing local image
        run: |
          docker image rm ${{ secrets.DOCKERHUB_USERNAME }}/kanbanbackend:latest || true

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/kanbanbackend:latest \
            ./kanbanBackend

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/kanbanbackend:latest
